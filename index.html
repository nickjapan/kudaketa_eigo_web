<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EN">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4F8FC">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>砕けた英語訳</title>
<style>
  :root {
    --bg: #F4F8FC; --panel: #FFFFFF; --line: #D9E3EE; --text: #2B3A4A; --sub: #6B7B8C;
    --accent: #3B7DD8; --accent-dark: #2F6BC0; --rec: #DE3434; --ok: #2E8B57;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif; }
  main { max-width: 640px; margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 20px); }
  h1 { font-size: 17px; font-weight: 500; color: var(--sub); margin: 0 0 12px; letter-spacing: .02em; }
  label { display: block; font-size: 16px; color: var(--sub); margin: 0 0 6px; }
  textarea { width: 100%; font: inherit; font-size: 22px; line-height: 1.5; color: var(--text);
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; resize: none; }
  textarea:focus { outline: none; border-color: var(--accent); }
  #ja { height: 150px; }
  .row { display: flex; gap: 12px; margin: 14px 0 22px; }
  button { font: inherit; font-size: 22px; font-weight: 600; border-radius: 14px; border: 0; padding: 18px 10px;
    flex: 1; cursor: pointer; }
  #mic { background: var(--panel); color: var(--text); border: 1px solid var(--line); flex: 0 0 38%; }
  #mic.rec { background: var(--rec); color: #fff; border-color: var(--rec); }
  #go { background: var(--accent); color: #fff; }
  #go:active { background: var(--accent-dark); }
  #go:disabled { opacity: .55; }
  #en { min-height: 170px; font-size: 22px; }
  #copy { width: 100%; margin-top: 12px; background: var(--panel); color: var(--accent); border: 1px solid var(--accent); }
  .voice { display: flex; gap: 12px; margin-top: 12px; }
  #voice { flex: 1; font: inherit; font-size: 19px; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 14px; padding: 0 12px; min-width: 0; }
  #play { flex: 0 0 36%; background: var(--accent); color: #fff; }
  #play:active { background: var(--accent-dark); }
  #play:disabled { opacity: .55; }
  #msg { min-height: 28px; margin-top: 12px; font-size: 18px; color: var(--sub); text-align: center; }
  #msg.ok { color: var(--ok); }
  #msg.err { color: var(--rec); }
  #setup { display: none; background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 18px; font-size: 19px; line-height: 1.6; margin-bottom: 18px; }
</style>
</head>
<body>
<main>
  <h1>砕けた英語訳</h1>
  <div id="setup"></div>

  <label for="ja">日本語</label>
  <textarea id="ja" placeholder="🎤 を押して話す(キーボードのマイクでも可)"></textarea>
  <div class="row">
    <button id="mic" type="button">🎤 話す</button>
    <button id="go" type="button">英語にする</button>
  </div>

  <label for="en">英語(自動でコピーします)</label>
  <textarea id="en" readonly></textarea>
  <button id="copy" type="button">もう一度コピー</button>
  <div class="voice">
    <select id="voice" aria-label="声"></select>
    <button id="play" type="button">🔊 再生</button>
  </div>
  <div id="msg"></div>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const KEY_NAME = "kudaketa_eigo_key";
const EL_KEY_NAME = "kudaketa_eigo_el";

// ---- 鍵(QRコードのアドレスの # のうしろに入っている。サーバーには送られない) ----
// k= は英語にする所(Claude)、e= は声(ElevenLabs)
function loadKey(re, name) {
  const m = location.hash.match(re);
  if (m) {
    try { localStorage.setItem(name, decodeURIComponent(m[1])); } catch (e) {}
    return decodeURIComponent(m[1]);
  }
  try { return localStorage.getItem(name); } catch (e) { return null; }
}
const apiKey = loadKey(/[#&]k=([^&]+)/, KEY_NAME);
const elKey = loadKey(/[#&]e=([^&]+)/, EL_KEY_NAME);
const standalone = window.navigator.standalone === true;
if (!apiKey) {
  $("setup").style.display = "block";
  $("setup").textContent = "パソコンに出した四角い模様(QRコード)を、iPhone のカメラで写して開いてください。";
} else if (!standalone && location.hash) {
  $("setup").style.display = "block";
  $("setup").innerHTML = "準備ができました ✓<br>下の <b>共有ボタン(□に↑)</b> →「<b>ホーム画面に追加</b>」を押してください。";
}

// ---- 辞書と指示文(Windows 版と同じ物。Windows で辞書を直すと自動でここに届く) ----
let PROMPT = null, DICT = [];
async function loadShared() {
  const t = Date.now();
  const [p, d] = await Promise.all([
    fetch("prompt.json?t=" + t, { cache: "no-store" }).then(r => r.json()),
    fetch("dict.json?t=" + t, { cache: "no-store" }).then(r => r.json()).catch(() => []),
  ]);
  PROMPT = p; DICT = Array.isArray(d) ? d.filter(w => w && w.ja && w.en) : [];
}
const shared = loadShared();

function fixWrong(text) {  // 声の聞き違い → 正しい日本語
  for (const w of DICT) for (const bad of (w.wrong || [])) if (bad) text = text.split(bad).join(w.ja);
  return text;
}
function fixSpelling(post) {  // 辞書の名前を辞書どおりの大文字・小文字に
  const ws = [...DICT].sort((a, b) => b.en.length - a.en.length);
  for (const w of ws) {
    const esc = w.en.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    post = post.replace(new RegExp("(?<![A-Za-z0-9])" + esc + "(?![A-Za-z0-9])", "gi"), w.en);
  }
  return post;
}
function clean(post) {  // 骸骨などの絵文字と ngl は、出てきても取り除く(Windows 版と同じ)
  for (const e of ["💀", "☠️", "☠", "🖕"]) post = post.split(e).join("");
  post = post.replace(/(?<![A-Za-z])ngl(?![A-Za-z])[,.]?\s*/gi, "");
  return post.replace(/[ \t]{2,}/g, " ").trim();
}
function dictLines() {
  return DICT.map(w => `- ${w.ja}${w.reading ? `(read: ${w.reading})` : ""} -> ${w.en}`).join("\n");
}

async function translate(ja) {
  await shared;
  let system = PROMPT.system;
  if (DICT.length) system += PROMPT.dict_header + dictLines();
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: PROMPT.model, max_tokens: 1024, system,
      thinking: { type: "disabled" },
      output_config: { format: { type: "json_schema", schema: PROMPT.schema } },
      messages: [{ role: "user", content: fixWrong(ja) }],
    }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error((data.error && data.error.message) || ("エラー " + res.status));
  const text = (data.content || []).filter(b => b.type === "text").map(b => b.text).join("");
  const out = JSON.parse(text);
  const post = clean(fixSpelling((out.post || "").trim()));
  lastPost = post;
  lastSpeech = clean(fixSpelling((out.speech || "").trim())) || speakable(post);
  return post;
}

// ---- 🔊 再生(ElevenLabs の声。同じ文と声は2回目から iPhone の中の控えで鳴らすので料金はかからない) ----
const VOICES = [  // 若い男性・元気な声(nick さんの希望で Adam をはじめの声に)
  ["pNInz6obpgDQGcFmaJgB", "Adam(力強い)"],
  ["IKne3meq5aSn9XLyUdCD", "Charlie(ノリ)"],
  ["TX3LPaxmHKxFdv7VOQHJ", "Liam(元気)"],
  ["SOYHLrjzK2X1ezoPC6cr", "Harry(荒め)"],
  ["N2lVS1w4EtoT3dr4eOWO", "Callum(ハスキー)"],
  ["bIHbv24MWmeRgasZH58o", "Will(ゆるい)"],
];
const VOICE_NAME = "kudaketa_eigo_voice";
let lastPost = "", lastSpeech = "";
const voiceSel = $("voice");
for (const [id, name] of VOICES) voiceSel.add(new Option(name, id));
try { const v = localStorage.getItem(VOICE_NAME); if (v && VOICES.some(x => x[0] === v)) voiceSel.value = v; } catch (e) {}
voiceSel.addEventListener("change", () => { try { localStorage.setItem(VOICE_NAME, voiceSel.value); } catch (e) {} });

function speakable(post) {  // 手で直した文など、読み上げ用が無い時: 絵文字を抜き、略語を話し言葉に
  const words = { rn: "right now", u: "you", ur: "your", bc: "because", tbh: "to be honest",
    omg: "oh my god", fr: "for real", idk: "I don't know", lol: "haha", w: "with", pls: "please", thx: "thanks" };
  let s = post.replace(/[\p{Extended_Pictographic}\u{1F3FB}-\u{1F3FF}‍️]/gu, "").replace(/#\S+/g, "");
  s = s.replace(/\b[A-Za-z]+\b/g, w => words[w.toLowerCase()] || w);
  return s.replace(/\s{2,}/g, " ").replace(/\s+([,.!?])/g, "$1").trim();
}

const player = new Audio();
player.setAttribute("playsinline", "");
const audioCache = new Map();
// iPhone は「押した瞬間」に一度鳴らした物しか、あとから鳴らせないので、押した瞬間に無音を鳴らしておく
const SILENT = (() => {
  const n = 800, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  str(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); str(8, "WAVEfmt "); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, 16000, true); v.setUint32(28, 32000, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true); str(36, "data"); v.setUint32(40, n * 2, true);
  return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
})();

async function play() {
  const en = $("en").value.trim();
  if (!en) { say("先に英語にしてください", "err"); return; }
  if (!elKey) { say("声の鍵がありません。QRコードを写し直してください", "err"); return; }
  const text = (en === lastPost && lastSpeech) ? lastSpeech : speakable(en);
  const voice = voiceSel.value;
  const ck = voice + "|" + text;
  if (audioCache.has(ck)) {
    player.src = audioCache.get(ck); player.currentTime = 0;
    player.play().then(() => say("再生しています 🔊", "ok")).catch(e => say("鳴らせませんでした: " + e.message, "err"));
    return;
  }
  player.src = SILENT; player.play().catch(() => {});
  $("play").disabled = true; say("声を作っています…");
  try {
    const res = await fetch("https://api.elevenlabs.io/v1/text-to-speech/" + voice + "?output_format=mp3_44100_128", {
      method: "POST",
      headers: { "content-type": "application/json", "xi-api-key": elKey, "accept": "audio/mpeg" },
      body: JSON.stringify({ text, model_id: "eleven_v4" }),
    });
    if (!res.ok) {
      let m = "エラー " + res.status;
      try { const j = await res.json(); m = (j.detail && (j.detail.message || j.detail)) || m; } catch (e) {}
      throw new Error(m);
    }
    const url = URL.createObjectURL(await res.blob());
    audioCache.set(ck, url);
    player.src = url; player.currentTime = 0;
    await player.play();
    say("再生しています 🔊(もう一度押すと料金なしで鳴ります)", "ok");
  } catch (e) {
    say("声にできませんでした: " + e.message, "err");
  } finally {
    $("play").disabled = false;
  }
}
$("play").addEventListener("click", play);

function say(text, cls) { $("msg").textContent = text; $("msg").className = cls || ""; }

// 「英語にする」: 押した瞬間にコピーの予約をしてから英語にする(iPhone は押した時でないとコピーできないため)
async function run() {
  const ja = $("ja").value.trim();
  if (!ja) { say("先に日本語を話してください", "err"); return; }
  if (!apiKey) { say("QRコードから開いてください", "err"); return; }
  $("go").disabled = true; $("en").value = ""; say("英語にしています…");
  const job = translate(ja);
  let copied = false;
  try {
    if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
      const blob = job.then(t => new Blob([t], { type: "text/plain" }));
      navigator.clipboard.write([new ClipboardItem({ "text/plain": blob })]).then(() => { copied = true; }).catch(() => {});
    }
    const en = await job;
    $("en").value = en;
    if (!copied) { try { await navigator.clipboard.writeText(en); copied = true; } catch (e) {} }
    await new Promise(r => setTimeout(r, 150));
    say(copied ? "コピーしました ✓ Instagram に貼れます" : "「もう一度コピー」を押してください", copied ? "ok" : "");
  } catch (e) {
    say("うまくいきませんでした: " + e.message, "err");
  } finally {
    $("go").disabled = false;
  }
}
$("go").addEventListener("click", run);

$("copy").addEventListener("click", async () => {
  const en = $("en").value;
  if (!en) return;
  try { await navigator.clipboard.writeText(en); say("コピーしました ✓", "ok"); }
  catch (e) { $("en").select(); say("長押しでコピーしてください", "err"); }
});

// ---- 🎤 話す(押して話す → もう一度押すと止めて、そのまま英語にする) ----
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, base = "";
if (!SR) {
  $("mic").style.display = "none";
} else {
  $("mic").addEventListener("click", () => {
    if (rec) { rec.stop(); rec = null; $("mic").classList.remove("rec"); $("mic").textContent = "🎤 話す"; run(); return; }
    rec = new SR();
    rec.lang = "ja-JP"; rec.continuous = true; rec.interimResults = true;
    base = "";
    $("ja").value = "";
    rec.onresult = (ev) => {
      let fin = "", mid = "";
      for (const r of ev.results) (r.isFinal ? (fin += r[0].transcript) : (mid += r[0].transcript));
      $("ja").value = base + fin + mid;
    };
    rec.onerror = (ev) => { say("マイクが使えません(" + ev.error + ")。キーボードのマイクで話してください", "err"); };
    rec.onend = () => { if (rec) { $("mic").classList.remove("rec"); $("mic").textContent = "🎤 話す"; rec = null; } };
    rec.start();
    $("mic").classList.add("rec"); $("mic").textContent = "■ 止めて英語に";
    say("聞いています…");
  });
}
</script>
</body>
</html>
